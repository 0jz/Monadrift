<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Monadrift</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="shell shell-center">
  <header>
    <div class="brand">
      <div class="brand-mark"></div>
      <h1>Monadrift</h1>
    </div>
    <span class="net-pill">Monad Testnet</span>
  </header>

  <div class="card join-card">
    <p class="join-blurb">The track is generated seconds before the race. Nobody — human or agent — has seen it yet.</p>
    <div id="join">
      <input id="playerId" placeholder="your name" autocomplete="off" />
      <select id="mode"><option value="HUMAN_ONLY">Human lobby</option></select>
      <button id="joinBtn">Join race</button>
    </div>
    <p id="joinStatus" class="join-status"></p>
  </div>
</div>

<script src="shared.js"></script>
<script src="join.js"></script>
</body>
</html>
