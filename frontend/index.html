<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Monadrift</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0d14; color: #eaeaf0; font-family: system-ui, sans-serif; }
  header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: baseline; }
  header h1 { font-size: 18px; margin: 0; }
  header .tag { font-size: 12px; color: #7a7f95; }
  #track { display: block; width: 100%; height: 60vh; background: #111420; }
  #hud { display: flex; gap: 16px; padding: 10px 16px; font-size: 14px; flex-wrap: wrap; }
  #hud span b { color: #8be9fd; }
  #lanes { display: flex; gap: 10px; padding: 16px; }
  #lanes button {
    flex: 1; padding: 22px 0; font-size: 18px; font-weight: 600;
    background: #1c2030; color: #eaeaf0; border: 1px solid #2e3350; border-radius: 10px;
  }
  #lanes button:active { background: #2e3350; }
  #log { padding: 8px 16px; font-size: 12px; color: #7a7f95; max-height: 18vh; overflow-y: auto; white-space: pre-wrap; }
  #join { padding: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  #join input, #join select { padding: 8px; border-radius: 6px; border: 1px solid #2e3350; background: #1c2030; color: #eaeaf0; }
  #join button { padding: 8px 14px; border-radius: 6px; border: none; background: #8be9fd; color: #0b0d14; font-weight: 700; }
</style>
</head>
<body>
<header>
  <h1>Monadrift</h1>
  <span class="tag">600ms or it didn't happen.</span>
</header>

<div id="join">
  <input id="playerId" placeholder="your name" />
  <select id="mode"><option value="HUMAN_ONLY">Human lobby</option></select>
  <button id="joinBtn">Join race</button>
</div>

<canvas id="track" width="1000" height="300"></canvas>

<div id="hud">
  <span>Position: <b id="hudPos">-</b></span>
  <span>HP: <b id="hudHp">-</b></span>
  <span>Speed: <b id="hudSpeed">-</b></span>
  <span>Stake: <b id="hudStake">-</b></span>
  <span>Last move: <b id="hudLatency">-</b></span>
</div>

<div id="lanes">
  <button data-lane="LEFT">◀ LEFT</button>
  <button data-lane="CENTER">■ CENTER</button>
  <button data-lane="RIGHT">RIGHT ▶</button>
</div>

<div id="log"></div>

<script src="app.js"></script>
</body>
</html>
