<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Monadrift</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="shell shell-center">
  <header>
    <div class="brand">
      <div class="brand-mark"></div>
      <h1>Mona<span class="rift">drift</span></h1>
    </div>
  </header>

  <div class="card join-card" id="registerView">
    <p class="join-blurb">The track is generated seconds before the race. Nobody — human or agent — has seen it yet.</p>
    <div id="join">
      <input id="addressInput" class="mono" placeholder="your address (optional — leave blank to generate)" autocomplete="off" />
      <button id="registerBtn">Register</button>
    </div>
    <p id="joinStatus" class="join-status"></p>
  </div>

  <div class="card join-card hidden" id="identityView">
    <p class="join-blurb">Your on-chain identity for this session — a fresh wallet, funded automatically, no seed phrase.</p>
    <div class="identity-row">
      <span class="stat-label">Public address</span>
      <span class="mono identity-address" id="identityAddress">—</span>
    </div>
    <button id="continueBtn">Continue to lobby</button>
  </div>
</div>

<script src="shared.js"></script>
<script src="join.js"></script>
</body>
</html>
