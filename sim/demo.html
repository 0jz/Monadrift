<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monadrift sim demo</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0d0e12; color: #e8e8ee; font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  header { padding: 12px 16px; display: flex; gap: 20px; flex-wrap: wrap; align-items: baseline; }
  h1 { font-size: 16px; margin: 0; color: #d9ff3f; }
  #hud span { margin-right: 16px; }
  canvas { display: block; width: 100%; height: calc(100vh - 90px); background: #0d0e12; }
  footer { padding: 0 16px 10px; color: #8a8ca0; }
  button { font: inherit; background: #1b1d25; color: inherit; border: 1px solid #333; padding: 2px 10px; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>MONADRIFT · sim prototype</h1>
  <div id="hud"><span id="t">0.00s</span><span id="spd">0 km/h</span><span id="walls">walls 0</span><span id="best"></span></div>
  <label>seed <input id="seed" type="number" value="1" style="width:5em"></label>
  <button id="restart">restart</button>
</header>
<canvas id="c"></canvas>
<footer>↑/W throttle · ↓/S brake · ←/→ or A/D steer · you only see the next few sections (fog of war) · same deterministic sim the replay verifier uses</footer>
<script type="module" src="demo.js"></script>
</body>
</html>
