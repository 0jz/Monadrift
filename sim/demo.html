<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monadrift — Time Trial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  /* Same tokens and look as frontend/style.css (the main site). */
  :root {
    color-scheme: dark;
    --bg: #0d0d0f; --surface: #17171a; --surface-2: #1e1e22; --line: #313136;
    --ink: #f4f4f2; --ink-dim: #8f8f96; --accent: #d7ff3f; --accent-ink: #10120a; --danger: #ff4d5e; --ok: #37e08c;
  }
  * { box-sizing: border-box; }
  button, input { font-family: inherit; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .shell { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 20px 16px; display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 13px; }
  .brand-mark { width: 22px; height: 22px; background: var(--accent); transform: rotate(45deg); position: relative; }
  .brand-mark::after { content: ""; position: absolute; inset: 5px; background: var(--bg); }
  .brand h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; margin: 0; text-transform: uppercase; }
  .brand h1 .rift { color: var(--accent); }
  .controls { display: flex; align-items: center; gap: 6px; }
  .controls label { font-size: 10px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .controls input { width: 7em; background: var(--surface); color: var(--ink); border: 1px solid var(--line); padding: 7px 9px; font-size: 13px; }
  .controls button { background: var(--surface); color: var(--ink); border: 1px solid var(--line); padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .controls button:hover { border-color: var(--accent); color: var(--accent); }
  .controls button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .controls button.primary:hover { color: var(--accent-ink); filter: brightness(1.08); }
  .card { background: var(--surface); border: 1px solid var(--line); position: relative; margin-bottom: 12px; }
  .card::before, .card::after { content: ""; position: absolute; width: 9px; height: 9px; border: 2px solid var(--accent); opacity: 0.55; pointer-events: none; }
  .card::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .card::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
  #hud { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 1px; background: var(--line); }
  .stat { background: var(--surface); padding: 10px 14px; }
  .stat-label { font-family: "JetBrains Mono", monospace; font-size: 10px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .stat-value { font-family: "JetBrains Mono", monospace; font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat-value.speed { color: var(--accent); }
  .stat-value.walls { color: var(--danger); }
  .stat-value.best { color: var(--ok); }
  #track-wrap { flex: 1; min-height: 240px; margin-bottom: 0; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <div class="brand-mark"></div>
      <h1>Mona<span class="rift">drift</span></h1>
    </div>
    <div class="controls">
      <label for="seed">Seed</label>
      <input id="seed" class="mono" type="number" min="0">
      <button id="random" class="primary" title="New random track">New track</button>
      <button id="restart" title="Same track again">Restart</button>
    </div>
  </header>

  <div class="card" id="hud">
    <div class="stat"><div class="stat-label">Time</div><div class="stat-value" id="t">0.0s</div></div>
    <div class="stat"><div class="stat-label">Speed</div><div class="stat-value speed" id="spd">0 km/h</div></div>
    <div class="stat"><div class="stat-label">Walls</div><div class="stat-value walls" id="walls">0</div></div>
    <div class="stat"><div class="stat-label">Best</div><div class="stat-value best" id="best">—</div></div>
  </div>

  <div class="card" id="track-wrap"><canvas id="c"></canvas></div>
</div>
<script type="module" src="demo.js"></script>
</body>
</html>
